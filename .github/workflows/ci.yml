name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install MoonBit stable
        run: |
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          bash "$RUNNER_TEMP/install-moon.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bash scripts/verify.sh
      - name: Reproduce pinned junitparser oracle in an isolated Python environment
        run: |
          python3 -m pip download --no-deps --only-binary=:all: --require-hashes -r scripts/reference/requirements.txt -d _build/reference
          python3 -m venv --without-pip _build/reference/venv
          _build/reference/venv/bin/python -I scripts/reference/junitparser_diff.py --wheel _build/reference/junitparser-5.0.3-py3-none-any.whl --oracle-output _build/reference/oracle.json
          cmp fixtures/junitparser-contract.json _build/reference/oracle.json
      - name: Build identical release archives twice
        run: |
          python3 scripts/release.py --output _build/archives-a
          python3 scripts/release.py --output _build/archives-b
          diff -r _build/archives-a _build/archives-b
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: junit-delta-release
          path: _build/archives-a/*
          if-no-files-found: error
          retention-days: 14
  portable:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: junit-delta-release
          path: release-input
      - name: Verify and run the unpacked portable CLI without MoonBit
        shell: bash
        env:
          UNPACKED: ${{ runner.temp }}/junit-delta-unpacked
        run: |
          python scripts/verify-release.py release-input --extract-cli "$UNPACKED"
          node scripts/e2e.mjs --portable "$UNPACKED/junit-delta-0.1.0-cli"
          node scripts/scenarios.mjs --portable "$UNPACKED/junit-delta-0.1.0-cli"
