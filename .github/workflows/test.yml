name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_INSTALL_VERSION: '1.0.0-rc1+3c0520448'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install MoonBit on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          bash "$RUNNER_TEMP/install-moon.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://cli.moonbitlang.com/install/powershell.ps1 -OutFile "$env:RUNNER_TEMP/install-moon.ps1"
          & "$env:RUNNER_TEMP/install-moon.ps1"
          "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH
      - name: Verify the compiler
        shell: bash
        run: |
          moon version --all
          version=$(moonc -v)
          test "${version%% *}" = "v$MOONBIT_INSTALL_VERSION"
      - run: moon update
      - name: Check all four backends
        if: runner.os == 'Linux'
        run: moon check --deny-warn --target all
      - name: Build all four backends
        if: runner.os == 'Linux'
        run: moon build --deny-warn --release --target all
      - name: Test the library on all four backends
        if: runner.os == 'Linux'
        run: moon test --deny-warn --target all
      - name: Run the report editing example
        if: runner.os == 'Linux'
        run: moon run examples/edit --target wasm-gc --deny-warn
      - name: Test the CLI with Node.js
        run: node --test tests/cli.test.mjs
      - uses: actions/setup-python@v6
        if: runner.os == 'Linux'
        with:
          python-version: '3.13'
      - name: Compare against junitparser 5.0.3
        if: runner.os == 'Linux'
        run: |
          python -m pip install junitparser==5.0.3 lxml==6.1.1
          python tests/check_parity.py
